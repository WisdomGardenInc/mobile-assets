<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video.js Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@7.21.0/dist/video-js.min.css" integrity="sha256-MQILNoDAnXbaJT0pfW0/qpj9a1UcHHUYKduMEqn0oa0=" crossorigin="anonymous">
  <style>
    :root {
      font: 16px/1.5 system-ui, sans-serif;
      color: #183638;
      background: #f4f9f9;
    }

    body {
      margin: 0;
    }

    main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #source-form {
      box-sizing: border-box;
      align-self: center;
      width: 100%;
      max-width: 52rem;
      padding: 1rem;
    }

    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
    label { font-weight: 650; }

    .source-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    input, button {
      border: 1px solid #a7c0c2;
      border-radius: 0.35rem;
      padding: 0.5rem 0.75rem;
      font: inherit;
    }

    input { min-width: 0; flex: 1 1 10rem; }
    button { border-color: #005c62; color: #fff; background: #005c62; cursor: pointer; }
    :focus-visible { outline: 2px solid #005c62; outline-offset: 2px; }

    #source-error { margin: 0.5rem 0 0; color: #a62735; }
    #source-error:empty { margin: 0; }

    #player {
      flex: 1;
      position: relative;
      min-height: 14rem;
      --video-ratio: 1.777778;
    }

    #player .wg-video:not(.vjs-fullscreen) {
      position: absolute;
      inset: 0 0 auto;
      width: min(100%, calc(var(--player-height, 100vh) * var(--video-ratio)));
      height: auto;
      aspect-ratio: var(--video-ratio);
      margin-inline: auto;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/video.js@7.21.0/dist/video.min.js" integrity="sha256-g0QI4cIRHjM66SR0Al0fexaBmWOJRsqmbs7StKonXG4=" crossorigin="anonymous"></script>
</head>

<body>
  <main>
    <form id="source-form" novalidate>
      <h1>Video.js Playground</h1>
      <label for="source-url">Video URL</label>
      <div class="source-controls">
        <input id="source-url" type="url" placeholder="https://example.com/video.mp4"
          autocomplete="off" spellcheck="false" aria-describedby="source-error" required>
        <button type="submit">Load video</button>
      </div>
      <p id="source-error" role="alert"></p>
    </form>
    <div id="player" hidden>
      <video id="wg-video" class="video-js wg-video" playsinline></video>
    </div>
    <noscript>Enable JavaScript to load and play videos.</noscript>
  </main>
  <script>
    const form = document.querySelector("#source-form");
    const sourceInput = document.querySelector("#source-url");
    const sourceError = document.querySelector("#source-error");
    const playerContainer = document.querySelector("#player");
    const params = new URLSearchParams(window.location.search);
    const initialSource = params.get("src");
    const initialType = params.get("type");
    let player;

    new ResizeObserver(([{ contentRect }]) => {
      playerContainer.style.setProperty("--player-height", `${contentRect.height}px`);
    }).observe(playerContainer);

    function loadVideo(value, type) {
      sourceError.textContent = "";
      sourceInput.removeAttribute("aria-invalid");
      let url;
      try {
        url = new URL(value);
      } catch {
        sourceInput.setAttribute("aria-invalid", "true");
        sourceError.textContent = "Enter a valid video URL.";
        return;
      }

      if (typeof videojs !== "function") {
        sourceError.textContent = "Video.js could not load. Reload the page and try again.";
        return;
      }

      playerContainer.hidden = false;
      if (!player) {
        player = videojs("wg-video", {
          controls: true,
          autoplay: true,
          preload: "auto",
        });
        player.on("loadedmetadata", () => {
          const width = player.videoWidth();
          const height = player.videoHeight();
          if (width && height) {
            playerContainer.style.setProperty("--video-ratio", width / height);
          }
        });
        player.on("error", () => {
          const error = player.error();
          if (error) {
            sourceError.textContent = `Playback error (${error.code}): ${error.message}`;
          }
        });
      }

      const source = { src: url.href };
      if (type) {
        source.type = type;
      } else if (!url.pathname.includes(".")) {
        source.type = "video/mp4";
      }
      playerContainer.style.removeProperty("--video-ratio");
      player.error(null);
      player.src(source);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const value = sourceInput.value.trim();
      loadVideo(value, value === initialSource ? initialType : null);
    });

    if (initialSource !== null) {
      sourceInput.value = initialSource;
      loadVideo(initialSource, initialType);
    }
  </script>
</body>

</html>
