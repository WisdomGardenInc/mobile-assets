<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WG QR Code format</title>
    <style>
        body {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0.75rem;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.25rem, 4vw, 2rem);
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            min-height: 0;
        }

        .inputarea {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
            min-height: 0;
        }

        .input {
            flex: 1;
            min-height: 0;
            resize: none;
        }

        .inputarea button {
            align-self: start;
        }

        .result {
            max-height: 40%;
            overflow: auto;
            overflow-wrap: anywhere;
        }

        .result span {
            white-space: pre-wrap;
        }

        .error {
            color: #a62735;
        }
    </style>
    <script type="module">
        import { createApp } from 'https://unpkg.com/petite-vue?module';
        import { encodeData, decodeData } from "https://cdn.jsdelivr.net/npm/@wisdomgarden/qrcode-format@latest/+esm"
        createApp({
            encodeInput: JSON.stringify({ courseId: 1, rollcallId: 2, data: "test data" }),
            decodeInput: decodeURIComponent("0~%101!4~%102!3~data"),

            encodeOutput: "",
            decodeOutput: "",
            decodeError: "",

            onEncode: function () {
                try {
                    this.encodeOutput = encodeURIComponent(encodeData(JSON.parse(this.encodeInput.trim())));
                } catch (error) {
                    this.encodeOutput = error.toString();
                }

            },
            onDecode: function () {
                this.decodeOutput = "";
                this.decodeError = "";
                try {
                    const input = this.decodeInput.trim();
                    const decoded = decodeData(decodeURIComponent(input));
                    if (input && Object.keys(decoded).length === 0) {
                        this.decodeError = "Could not decode QR data. No fields were found.";
                        return;
                    }
                    this.decodeOutput = decoded;
                } catch (error) {
                    const detail = error instanceof URIError ? "Invalid percent encoding." : error.message;
                    this.decodeError = `Could not decode QR data. ${detail}`;
                }
            }
        }).mount("#app");
    </script>
</head>

<body id="app" v-scope>
    <h1>Wisdom Garden QR CODE Format</h1>
    <div class="main">
        <div class="inputarea">
            <textarea class="input" v-model="encodeInput" placeholder="input json" autocomplete="off" wrap="soft"
                spellcheck="false"></textarea>
            <button @click="onEncode">Encode</button>
            <div class="result" :tabindex="encodeOutput ? 0 : -1">
                <span v-text="encodeOutput"></span>
            </div>
        </div>
        <div class="inputarea">
            <textarea class="input" v-model="decodeInput" placeholder="input string" autocomplete="off" wrap="soft"
                spellcheck="false" :aria-invalid="!!decodeError" aria-describedby="decode-error"></textarea>
            <button @click="onDecode">Decode</button>
            <div class="result" :tabindex="decodeOutput || decodeError ? 0 : -1">
                <span v-text="decodeOutput"></span>
                <span id="decode-error" class="error" role="alert" v-text="decodeError"></span>
            </div>
        </div>
    </div>
</body>

</html>
