<html class=hydrated lang=en mode=ios><meta content="text/html; charset=UTF-8"http-equiv=Content-Type><meta charset=utf-8><meta content="IE=edge,chrome=1"http-equiv=X-UA-Compatible><meta content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover"name=viewport><meta content="max-age=0"http-equiv=cache-control><meta content=no-cache http-equiv=cache-control><meta content=0 http-equiv=expires><meta content="Tue, 01 Jan 1980 1:00:00 GMT"http-equiv=expires><meta content=no-cache http-equiv=pragma><title>TronClass Policy Jump</title><link href=favicon.ico rel=icon><div class=content>Loading ......</div><script>
  function jump() {
    const location = window.location;
    const endpointMatch = location.search.match(/[?&]endpoint=([^&?#]+)/);
    if (!endpointMatch) {
      console.error("缺少必需的endpoint参数");
      return;
    }

    const endpoint = decodeURIComponent(endpointMatch[1]);
    const appLegalEndpoints = ["privacy-policy", "user-agreement", "children-privacy-policy"];
    if (appLegalEndpoints.includes(endpoint)) {
      const destination = new URL("./app-legal/policy-jump.html", location.href);
      destination.search = location.search;
      destination.hash = location.hash;
      location.replace(destination.href);
      return;
    }

    const destination = location.href
      .replace("policy-jump", endpoint)
      .replace(/[?&]endpoint=[^&]*&?/, "?");
    location.replace(destination);
  }

  jump();
</script>
